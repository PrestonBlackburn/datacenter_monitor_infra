apiVersion: v1
kind: Pod
metadata:
  name: pg-restore
  labels:
    component: restore
spec:
  containers:
    - name: db-restore
      image: postgres:18
      imagePullPolicy: IfNotPresent
      envFrom:
        - secretRef:
            name: sensor-secrets
      env:
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: sensor-secrets
              key: POSTGRES_PASSWORD
      command:
        - sleep
        - "3600"
      volumeMounts:
        - name: backup-storage
          mountPath: /backup
  volumes:
    - name: backup-storage
      persistentVolumeClaim:
        claimName: sensors-backup-pvc
  restartPolicy: Never