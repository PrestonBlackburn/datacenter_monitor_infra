apiVersion: v1
kind: Secret
metadata:
  name: sensor-secrets
  namespace: sensors
type: Opaque
stringData:
  POSTGRES_DB: "sensors"
  POSTGRES_USER: "admin_user"
  POSTGRES_PASSWORD: "admin_pass"
  SENSOR_SVC_USER: "svc_user"
  SENSOR_SVC_PASSWORD: "svc_pass"
  CONSUMER_HEALTHCHECK: "your health url"
  DASHBOARD_HEALTHCHECK: "your health url"
  DATABASE_HEALTHCHECK: "your health url"
  BACKUPS_HEALTHCHECK: "your health url"