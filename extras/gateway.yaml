apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: sensors-gateway
  namespace: sensors
spec:
  gatewayClassName: nginx
  listeners:
    - name: postgres        # matched by sectionName above
      protocol: TCP
      port: 5432
      allowedRoutes:
        namespaces:
          from: Same
        kinds:
          - group: gateway.networking.k8s.io
            kind: TCPRoute